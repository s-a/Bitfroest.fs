<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--POLICY-->
  <title>Bitfroest.fs · Prototyp</title>
  <link rel="stylesheet" href="workbench-vendor.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="file-search.css">
</head>
<body>
  <nav class="main-menu" data-main-menu role="menubar" aria-label="Hauptmenü">
    <button type="button" role="menuitem" aria-haspopup="true" aria-expanded="false" aria-controls="main-menu-popup">Dateien</button>
    <button type="button" role="menuitem" aria-haspopup="true" aria-expanded="false" aria-controls="main-menu-popup">Markierung</button>
    <button type="button" role="menuitem" aria-haspopup="true" aria-expanded="false" aria-controls="main-menu-popup">Befehle</button>
    <button type="button" role="menuitem" aria-haspopup="true" aria-expanded="false" aria-controls="main-menu-popup">Ansicht</button>
    <button type="button" role="menuitem" aria-haspopup="true" aria-expanded="false" aria-controls="main-menu-popup">Konfigurieren</button>
    <button type="button" role="menuitem" aria-haspopup="true" aria-expanded="false" aria-controls="main-menu-popup">Hilfe</button>
    <div id="main-menu-popup" role="menu" aria-label="Dateien" hidden>
      <button type="button" role="menuitem" data-group="Dateien" data-menu-action="pack" data-menu-keys="alt+f5">Packen</button>
      <button type="button" role="menuitem" data-group="Dateien" data-menu-action="unpack" data-menu-keys="alt+f9 alt+f6">Entpacken</button>
      <button type="button" role="menuitem" data-group="Dateien" data-menu-action="test-archives" data-menu-keys="alt+shift+f9">Archive testen</button>
      <button type="button" role="menuitem" data-group="Dateien" data-menu-action="rename" data-menu-keys="ctrl+m">Mehrfach-Umbenennen</button>
      <button type="button" role="menuitem" data-group="Markierung" data-menu-action="select-group" data-menu-keys="numpad_add shift+numpad_add">Gruppe markieren...</button>
      <button type="button" role="menuitem" data-group="Markierung" data-menu-action="unselect-group" data-menu-keys="numpad_subtract shift+numpad_subtract">Gruppenauswahl rückgängig...</button>
      <button type="button" role="menuitem" data-group="Markierung" data-menu-action="select-all" data-menu-keys="ctrl+a">Alle markieren</button>
      <button type="button" role="menuitem" data-group="Markierung" data-menu-action="clear" data-menu-keys="ctrl+numpad_subtract ctrl+shift+numpad_subtract">Auswahl aufheben</button>
      <button type="button" role="menuitem" data-group="Markierung" data-menu-action="invert" data-menu-keys="numpad_multiply shift+numpad_multiply">Auswahl umkehren</button>
      <button type="button" role="menuitem" data-group="Markierung" data-menu-action="select-extension" data-menu-keys="ctrl+numpad_add alt+numpad_add">Alle Dateien mit gleicher Erweiterung markieren</button>
      <div role="separator" tabindex="-1" data-group="Markierung" class="menu-divider"></div>
      <button type="button" role="menuitem" data-group="Markierung" data-menu-action="save-selection">Auswahl merken</button>
      <button type="button" role="menuitem" data-group="Markierung" data-menu-action="restore-selection" data-menu-keys="numpad_divide">Auswahl wiederherstellen</button>
      <button type="button" role="menuitem" data-group="Markierung" data-menu-action="save-selection-file">Auswahl in Datei speichern</button>
      <button type="button" role="menuitem" data-group="Markierung" data-menu-action="load-selection-file">Auswahl aus Datei laden</button>
      <div role="separator" tabindex="-1" data-group="Markierung" class="menu-divider"></div>
      <button type="button" role="menuitem" data-group="Markierung" data-menu-action="copy-names">Kopiere markierte Namen in Zwischenablage</button>
      <button type="button" role="menuitem" data-group="Markierung" data-menu-action="copy-full-names" data-menu-keys="ctrl+y">Kopiere Namen mit Pfad in Zwischenablage</button>
      <button type="button" role="menuitem" data-group="Markierung" data-menu-action="copy-details">Kopiere Namen mit allen Details</button>
      <button type="button" role="menuitem" data-group="Markierung" data-menu-action="copy-full-details">Kopiere Namen mit Pfad+Details</button>
      <button type="button" role="menuitem" data-group="Befehle" data-menu-action="search" data-menu-keys="alt+f7">Suchen</button>
      <button type="button" role="menuitem" data-group="Befehle" data-menu-action="search-separate" data-menu-keys="alt+shift+f7">Suchen in separatem Fenster</button>
      <button type="button" role="menuitem" data-group="Befehle" data-menu-action="back" data-menu-keys="alt+left">Zurück</button>
      <button type="button" role="menuitem" data-group="Befehle" data-menu-action="swap-paths" data-menu-keys="ctrl+u">Pfade tauschen</button>
      <button type="button" role="menuitem" data-group="Befehle" data-menu-action="swap" data-menu-keys="ctrl+shift+u">Seiten tauschen</button>
      <button type="button" role="menuitem" data-group="Ansicht" data-menu-action="new-tab" data-menu-keys="ctrl+t">Neuer Ordner-Tab</button>
      <button type="button" role="menuitem" data-group="Ansicht" data-menu-action="sort:name">Nach Namen sortieren</button>
      <button type="button" role="menuitem" data-group="Ansicht" data-menu-action="sort:type">Nach Erweiterung sortieren</button>
      <button type="button" role="menuitem" data-group="Ansicht" data-menu-action="sort:date">Nach Datum/Zeit sortieren</button>
      <button type="button" role="menuitem" data-group="Ansicht" data-menu-action="sort:size">Nach Größe sortieren</button>
      <button type="button" role="menuitem" data-group="Ansicht" data-menu-action="refresh" data-menu-keys="ctrl+r">Neu einlesen</button>
      <button type="button" role="menuitem" data-group="Konfigurieren" data-menu-action="settings">Einstellungen</button>
      <button type="button" role="menuitem" data-group="Hilfe" data-menu-action="licenses">Lizenzen und Danksagungen</button>
    </div>
  </nav>
  <main>
    <div id="panes" class="panes"><p id="startup-message" role="status">Loading file manager…</p></div>
  </main>
  <footer id="statusbar" class="statusbar"></footer>
  <aside id="notifications-center" class="notifications-center" role="region" hidden></aside>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="modal" aria-labelledby="modal-title"><form id="modal-form" method="dialog"><div class="modal-heading"><div><div class="eyebrow" id="modal-eyebrow">DATEIAKTION</div><h2 id="modal-title"></h2></div><button type="button" id="modal-close" aria-label="Dialog schließen">×</button></div><div id="modal-body"></div><div class="modal-actions"><button type="button" id="modal-cancel">Abbrechen</button><button type="submit" id="modal-confirm" class="primary">Übernehmen</button></div></form></dialog>
  <script src="webview-bootstrap.js"></script>
  <script src="commander-paths.js"></script>
  <script src="commander-shortcuts.js"></script>
  <script src="shortcut-runtime.js"></script>
  <script src="commander-i18n.js"></script>
  <script src="commander-column-settings.js"></script>
  <script src="commander-tabs.js"></script>
  <script src="commander-columns.js"></script>
  <script src="commander-search.js"></script>
  <script src="file-search-view.js"></script>
  <script src="commander-contrast.js"></script>
  <script src="commander-file-colors.js"></script>
  <script src="commander-file-names.js"></script>
  <script src="commander-transfer.js"></script>
  <script src="search-duplicates.js"></script>
  <script src="commander-clipboard.js"></script>
  <script src="commander-lister.js"></script>
  <script src="lister-view.js"></script>
  <script src="workbench-vendor.js"></script>
  <script src="workbench-icons.js"></script>
  <script src="git-status-icons.js"></script>
  <script src="commander-statusbar.js"></script>
  <script src="app.js"></script>
</body>
</html>
