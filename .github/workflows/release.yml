name: Native builds and versioned releases

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      marketplace_tag:
        description: 'Publish an existing verified GitHub release to the Marketplace without rebuilding (for example v0.0.39). Leave empty to build only.'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: native-release-${{ inputs.marketplace_tag || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.marketplace_tag == ''
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: win32-x64
          - runner: ubuntu-24.04
            target: linux-x64
    uses: ./.github/workflows/build-vsix.yml
    with:
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
  experimental-macos:
    if: github.event_name != 'workflow_dispatch' || inputs.marketplace_tag == ''
    name: Experimental macOS ARM64
    uses: ./.github/workflows/build-vsix.yml
    with:
      runner: macos-15
      target: darwin-arm64
      experimental: true
  release:
    name: Publish versioned VSIX downloads
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: vsix-*
          merge-multiple: true
          path: ${{ runner.temp }}/release
      - name: Verify and publish the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/publish-release.cjs
  marketplace:
    name: Publish verified packages to Visual Studio Marketplace
    needs: [release]
    if: >-
      always() && !cancelled() &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.release.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.marketplace_tag != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: marketplace-${{ inputs.marketplace_tag || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.marketplace_tag && format('refs/tags/{0}', inputs.marketplace_tag) || github.ref }}
          path: release-source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - name: Check publishing safeguards
        run: node --test tests/marketplace-release.test.js tests/release-policy.test.js
      - name: Verify release provenance and publish with trusted identity
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MARKETPLACE_TAG: ${{ inputs.marketplace_tag || github.ref_name }}
        run: node scripts/publish-marketplace.cjs
