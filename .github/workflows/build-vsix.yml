name: Build platform VSIX

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      target:
        type: string
        required: true
      experimental:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      BUILD_TARGET: ${{ inputs.target }}
      EXPERIMENTAL_BUILD: ${{ inputs.experimental }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - name: Check release notes before building
        run: node scripts/check-release-notes.cjs
      - name: Install locked development dependencies
        run: npm ci
      - name: Install the Linux native SDK and headless test fixtures
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libglib2.0-dev libgdk-pixbuf-2.0-0 librsvg2-common shared-mime-info libxcb1-dev libxcb-xfixes0-dev libwayland-dev libwayland-bin gvfs gvfs-daemons dbus-daemon xvfb xclip mutter xwayland kwin-wayland wl-clipboard python3-gi dosfstools
      - name: Build the native module from pinned sources
        run: node scripts/ci-native-build.cjs
      - name: Check syntax and lint
        run: |
          npm run check
          npm run lint
      - name: Check architecture and release policy
        run: |
          npm run test:architecture
          node --test tests/repository-privacy.test.js tests/beta-release.test.js tests/release-policy.test.js tests/marketplace-release.test.js tests/release-notes.test.js
      - name: Prepare a private filesystem without hardlink support
        if: runner.os == 'Linux'
        run: |
          truncate -s 32M "$RUNNER_TEMP/native-fat.img"
          mkfs.vfat -F 16 "$RUNNER_TEMP/native-fat.img"
          mkdir "$RUNNER_TEMP/native-fat"
          sudo mount -t vfat -o "loop,uid=$(id -u),gid=$(id -g),umask=077" "$RUNNER_TEMP/native-fat.img" "$RUNNER_TEMP/native-fat"
          echo "NATIVE_HARDLINK_FREE_ROOT=$RUNNER_TEMP/native-fat" >> "$GITHUB_ENV"
      - name: Run platform tests
        run: |
          case "$BUILD_TARGET" in
            win32-x64) npm run test:native ;;
            linux-x64) npm run test:native:linux ;;
            darwin-arm64) node --test tests/native-api.test.js tests/git-status-native.test.js ;;
            *) exit 1 ;;
          esac
      - name: Verify KWin Wayland interoperability
        if: runner.os == 'Linux'
        env:
          NATIVE_TEST_COMPOSITOR: kwin
          BITFROEST_REQUIRE_LINUX_DESKTOP_TESTS: '1'
        run: node --test tests/native-clipboard-wayland-compositor.test.js
      - name: Verify metadata failures in an unprivileged host
        if: runner.os == 'Linux'
        run: |
          node_binary="$(command -v node)"
          "$node_binary" --version
          permissions_root="$(mktemp -d /tmp/bitfroest-permissions.XXXXXX)"
          trap 'rm -rf "$permissions_root"' EXIT
          cp native/binding.node "$permissions_root/binding.node"
          chmod 0755 "$permissions_root"
          chmod 0644 "$permissions_root/binding.node"
          sudo env "PATH=$PATH" "NATIVE_BINDING_TEST_PATH=$permissions_root/binding.node" "$node_binary" --test --test-name-pattern="unprivileged host" tests/native-copy-linux-api.test.js
      - name: Release the private test filesystem
        if: always() && runner.os == 'Linux'
        run: |
          if mountpoint --quiet "$RUNNER_TEMP/native-fat"; then sudo umount "$RUNNER_TEMP/native-fat"; fi
      - name: Verify the native module in the Electron runtime
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: npm exec --yes --package electron@43.8.3 -- electron --test-isolation=none --test tests/native-api.test.js tests/git-status-native.test.js
      - name: Package the pre-release extension
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ -f ".github/release-notes/$VERSION.md" ]]; then
            cp ".github/release-notes/$VERSION.md" CHANGELOG.md
          fi
          npm exec --yes --package @vscode/vsce@4.1.0 -- vsce package --pre-release --target "$BUILD_TARGET" --baseContentUrl "https://github.com/s-a/Bitfroest.fs/blob/$GITHUB_SHA/" --baseImagesUrl "https://raw.githubusercontent.com/s-a/Bitfroest.fs/$GITHUB_SHA/" --out "$RUNNER_TEMP/bitfroest-fs-$VERSION-$BUILD_TARGET.vsix"
      - name: Verify the isolated package and create checksums
        run: node scripts/verify-vsix.cjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ${{ inputs.experimental && 'experimental-vsix' || 'vsix' }}-${{ inputs.target }}
          path: ${{ runner.temp }}/bitfroest-fs-*.vsix*
          if-no-files-found: error
          retention-days: 14
